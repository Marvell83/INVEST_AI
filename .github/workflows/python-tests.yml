name: Python tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Forecast ledger and integration tests
        run: python -m unittest discover -s tests -v
      - name: Frozen 0.1 acceptance tests
        run: cd dogrulama && python kabul_testi.py
      - name: Experimental 0.2 module tests
        run: cd dogrulama && python -m unittest test_moduller_v02.py -v
